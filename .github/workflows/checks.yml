name: Проверка расчётов и комплекта

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Проверить среду
        run: |
          python3 --version
          node --version
      - name: Повторить независимые расчёты
        run: python3 scripts/reproduce.py
      - name: Проверить финансовые инварианты и границы
        run: python3 -m unittest discover -s tests -v
      - name: Проверить ссылки, источники и состав
        run: python3 scripts/check_repository.py
      - name: Убедиться в воспроизводимости опубликованных файлов
        run: git diff --exit-code -- app/index.html results/
